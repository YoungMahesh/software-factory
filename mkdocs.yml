site_name: Modal Sandboxes
site_description: Toolkit for provisioning, managing, and snapshotting isolated cloud execution environments on Modal.
site_author: Modal Sandboxes Contributors
repo_name: software-factory
repo_url: https://github.com/sFactory0/software-factory
docs_dir: docs
site_dir: site
theme:
  name: material
  palette:
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.sections
  - navigation.expand
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.code.annotate
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.highlight:
    anchor_linenums: true
    line_spans: __span
    pygments_lang_class: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.keys
- pymdownx.tabbed:
    alternate_style: true
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
plugins:
- search
validation:
  omitted_files: info
  unrecognized_links: warn
nav:
