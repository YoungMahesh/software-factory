services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: sandbox-dashboard-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - dbhost-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  dbhost-network:
    name: dbhost-network
    external: true
