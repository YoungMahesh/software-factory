services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    image: sf-caddy-cloudflare:2-alpine
    container_name: caddy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./conf/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./conf/sites:/etc/caddy/sites:ro
      - ./conf/apps:/etc/caddy/apps:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dbhost-network

volumes:
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config

networks:
  dbhost-network:
    name: dbhost-network
    external: true
