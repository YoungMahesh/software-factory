services:
  postgres:
    image: postgres:16-alpine
    container_name: neon-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/certs/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/certs/server.key
    ports:
      - "${HOST_BIND_IP:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./.data/certs/server.crt:/var/lib/postgresql/certs/server.crt:ro
      - ./.data/certs/server.key:/var/lib/postgresql/certs/server.key:ro
    networks:
      - dbhost-network

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: neon-seaweedfs
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-0.0.0.0}:${S3_PORT:-8333}:8333"
    command: "server -s3 -filer -dir=/data -s3.config=/data/s3.json"
    volumes:
      - ./.data/seaweedfs:/data
    networks:
      - dbhost-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: db-host-web
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST_BIND_IP=${HOST_BIND_IP:-0.0.0.0}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - PUBLIC_POSTGRES_PORT=${POSTGRES_PORT:-54320}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/neon_control_plane?sslmode=require
      - PGSSLMODE=require
      - NODE_EXTRA_CA_CERTS=/app/.data/certs/ca.crt
      - SEAWEEDFS_HOST=seaweedfs
      - SEAWEEDFS_ADMIN_ACCESS_KEY=${SEAWEEDFS_ADMIN_ACCESS_KEY}
      - SEAWEEDFS_ADMIN_SECRET_KEY=${SEAWEEDFS_ADMIN_SECRET_KEY}
      - CONTROL_PLANE_USERNAME=${CONTROL_PLANE_USERNAME:-admin}
      - CONTROL_PLANE_PASSWORD=${CONTROL_PLANE_PASSWORD}
      - BASIC_AUTH_USERNAME=${CONTROL_PLANE_USERNAME:-admin}
      - BASIC_AUTH_PASSWORD=${CONTROL_PLANE_PASSWORD}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - PUBLIC_POSTGRES_HOST=${PUBLIC_POSTGRES_HOST:-localhost}
      - DATA_DIR=/app/.data
      - HOST_DATA_DIR=${PWD}/.data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.data:/app/.data
    networks:
      - dbhost-network
    depends_on:
      - postgres
      - seaweedfs

networks:
  dbhost-network:
    name: dbhost-network
    external: true
