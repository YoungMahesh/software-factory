services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3000}
    container_name: ${APP_CONTAINER_NAME:-app-web}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      RESOURCE_PLANE_CA_CERT: /app/.certs/ca.crt
    volumes:
      - ./.certs:/app/.certs:ro
    networks:
      - dbhost-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles:
      - migrate
    env_file:
      - .env
    environment:
      RESOURCE_PLANE_CA_CERT: /app/.certs/ca.crt
    volumes:
      - ./.certs:/app/.certs:ro
    networks:
      - dbhost-network
    command: ["pnpm", "--filter", "@repo/web", "db:migrate"]

networks:
  dbhost-network:
    name: dbhost-network
    external: true
