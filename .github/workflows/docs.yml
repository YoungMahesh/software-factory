name: Documentation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - name: Install test and documentation dependencies
        run: python -m pip install -r requirements.txt
      - name: Check documentation references and serving
        run: pytest -q sandboxes/tests/test_documentation_contracts.py sandboxes/tests/test_docs.py
      - name: Build documentation in strict mode
        run: zensical build --strict
